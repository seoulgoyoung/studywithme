<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N분의 1 - 스마트 여행 정산 가계부</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-20 md:pb-10">

    <!-- Header -->
    <header class="bg-indigo-600 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-plane-departure text-xl text-indigo-200"></i>
                <h1 class="text-lg font-bold tracking-tight" id="tripTitleDisplay">우리의 멋진 여행</h1>
                <button onclick="editTripTitle()" class="text-indigo-200 hover:text-white text-xs p-1">
                    <i class="fa-solid fa-pen"></i>
                </button>
            </div>
            <button onclick="loadSampleData()" class="text-xs bg-indigo-500 hover:bg-indigo-700 text-indigo-100 px-2.5 py-1.5 rounded-lg transition-colors flex items-center gap-1">
                <i class="fa-solid fa-wand-magic-sparkles"></i> 예시 데이터
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto px-4 pt-4 pb-12">

        <!-- Stat Overview -->
        <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <span class="text-xs font-semibold text-slate-400">총 지출 금액</span>
                <span class="text-xl font-black text-indigo-600 mt-1" id="statTotalAmount">0원</span>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <span class="text-xs font-semibold text-slate-400">1인당 평균 지출</span>
                <span class="text-xl font-black text-emerald-600 mt-1" id="statPerPersonAmount">0원</span>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex bg-slate-200/80 p-1 rounded-xl mb-5 text-sm font-medium">
            <button id="tabBtn1" onclick="switchTab('expenses')" class="flex-1 py-2 rounded-lg text-center font-bold bg-white text-indigo-600 shadow-sm transition-all">
                <i class="fa-solid fa-receipt mr-1"></i> 지출 내역 (<span id="expenseCount">0</span>)
            </button>
            <button id="tabBtn2" onclick="switchTab('settlement')" class="flex-1 py-2 rounded-lg text-center font-semibold text-slate-600 transition-all">
                <i class="fa-solid fa-calculator mr-1"></i> 정산 결과
            </button>
            <button id="tabBtn3" onclick="switchTab('members')" class="flex-1 py-2 rounded-lg text-center font-semibold text-slate-600 transition-all">
                <i class="fa-solid fa-users mr-1"></i> 멤버 (<span id="memberCount">0</span>)
            </button>
        </div>

        <!-- TAB 1: Expenses Section -->
        <section id="tabExpenses" class="space-block">
            <!-- Add Expense Button / Quick Card -->
            <button onclick="openExpenseModal()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-2xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2 mb-5">
                <i class="fa-solid fa-plus text-lg"></i> 새 지출 등록하기
            </button>

            <!-- Filter & Search -->
            <div class="flex gap-2 mb-4 overflow-x-auto pb-1 hide-scrollbar" id="categoryFilterContainer">
                <button onclick="filterCategory('ALL')" class="cat-filter-btn active bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap">전체</button>
                <button onclick="filterCategory('식비')" class="cat-filter-btn bg-white text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap">🍔 식비</button>
                <button onclick="filterCategory('교통')" class="cat-filter-btn bg-white text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap">🚗 교통</button>
                <button onclick="filterCategory('숙박')" class="cat-filter-btn bg-white text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap">🏨 숙박</button>
                <button onclick="filterCategory('관광/쇼핑')" class="cat-filter-btn bg-white text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap">🎟️ 관광/쇼핑</button>
                <button onclick="filterCategory('기타')" class="cat-filter-btn bg-white text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap">🎈 기타</button>
            </div>

            <!-- Expense List -->
            <div id="expenseList" class="space-y-3">
                <!-- JS Populated -->
            </div>
            
            <div id="emptyExpenseState" class="hidden text-center py-12 text-slate-400 bg-white rounded-2xl border border-dashed border-slate-200">
                <i class="fa-solid fa-receipt text-4xl mb-3 text-slate-300"></i>
                <p class="text-sm font-medium">아직 등록된 지출이 없습니다.</p>
                <p class="text-xs text-slate-400 mt-1">여행 중 사용한 금액을 등록해보세요!</p>
            </div>
        </section>

        <!-- TAB 2: Settlement Section -->
        <section id="tabSettlement" class="hidden space-y-5">
            <!-- Share Summary Action -->
            <div class="flex justify-between items-center bg-indigo-50 border border-indigo-100 p-4 rounded-2xl">
                <div>
                    <h3 class="font-bold text-indigo-900 text-sm">정산 내역을 공유해보세요</h3>
                    <p class="text-xs text-indigo-600 mt-0.5">카카오톡이나 메신저로 바로 전달할 수 있습니다.</p>
                </div>
                <button onclick="copySettlementSummary()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition-all flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-share-nodes"></i> 내역 복사
                </button>
            </div>

            <!-- Minimum Transactions (Who pays Whom) -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-1 flex items-center gap-2">
                    <i class="fa-solid fa-arrow-right-arrow-left text-indigo-500"></i> 추천 정산 방식 (최소 송금)
                </h3>
                <p class="text-xs text-slate-400 mb-4">복잡하게 따로 보낼 필요 없이 아래대로 송금하면 깔끔하게 정산됩니다.</p>
                
                <div id="settlementTransList" class="space-y-2.5">
                    <!-- JS Populated -->
                </div>
            </div>

            <!-- Individual Balance Breakdown -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-check text-indigo-500"></i> 멤버별 개인 정산 현황
                </h3>
                <div id="memberBalanceList" class="space-y-3">
                    <!-- JS Populated -->
                </div>
            </div>
        </section>

        <!-- TAB 3: Members Section -->
        <section id="tabMembers" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-slate-800 mb-3">여행 참여 멤버</h3>
                
                <!-- Add Member Form -->
                <div class="flex gap-2 mb-4">
                    <input type="text" id="newMemberInput" placeholder="멤버 이름 (예: 민수)" class="flex-1 px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
                    <button onclick="addMember()" class="bg-slate-800 hover:bg-slate-900 text-white font-bold text-sm px-4 rounded-xl transition-colors">
                        추가
                    </button>
                </div>

                <!-- Member Chips/List -->
                <div id="memberChipList" class="space-y-2">
                    <!-- JS Populated -->
                </div>
            </div>
        </section>

    </main>

    <!-- Expense Modal (Add/Edit) -->
    <div id="expenseModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-2xl p-6 space-y-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                <h3 class="font-bold text-lg text-slate-800" id="modalTitle">지출 등록하기</h3>
                <button onclick="closeExpenseModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <input type="hidden" id="modalExpenseId">

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">사용 내역 / 항목명 *</label>
                <input type="text" id="modalTitleInput" placeholder="예: 해산물 식당, 택시비" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">결제 금액 (원) *</label>
                    <input type="number" id="modalAmountInput" placeholder="0" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 font-bold text-indigo-600">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 mb-1">카테고리</label>
                    <select id="modalCategorySelect" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-white">
                        <option value="식비">🍔 식비</option>
                        <option value="교통">🚗 교통</option>
                        <option value="숙박">🏨 숙박</option>
                        <option value="관광/쇼핑">🎟️ 관광/쇼핑</option>
                        <option value="기타">🎈 기타</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">결제한 사람 *</label>
                <select id="modalPayerSelect" class="w-full px-3.5 py-2.5 text-sm rounded-xl border border-slate-200 focus:outline-none focus:border-indigo-500 bg-white font-medium text-slate-700">
                    <!-- JS Populated -->
                </select>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="text-xs font-bold text-slate-500">함께 부담할 사람 (N빵) *</label>
                    <button type="button" onclick="selectAllParticipants(true)" class="text-[11px] text-indigo-600 hover:underline">전체 선택</button>
                </div>
                <div id="modalParticipantsContainer" class="flex flex-wrap gap-2 pt-1">
                    <!-- JS Populated -->
                </div>
            </div>

            <div class="pt-2 flex gap-2">
                <button onclick="closeExpenseModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-colors text-sm">
                    취소
                </button>
                <button onclick="saveExpense()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors text-sm shadow-md shadow-indigo-100">
                    저장하기
                </button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs px-4 py-2.5 rounded-full shadow-lg opacity-0 transition-opacity pointer-events-none z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">복사되었습니다.</span>
    </div>

    <!-- App State Script -->
    <script>
        // State
        let state = {
            tripTitle: "제주도 3박4일 여행",
            members: ["민수", "지은", "현우", "유진"],
            expenses: [],
            selectedCategory: 'ALL'
        };

        // Initialize App
        window.onload = function() {
            // Load saved data or set defaults
            loadState();
            renderAll();
        };

        function saveState() {
            // In-memory application state maintained
        }

        function loadState() {
            // Initial render state ready
        }

        // Render Master
        function renderAll() {
            document.getElementById('tripTitleDisplay').innerText = state.tripTitle;
            document.getElementById('memberCount').innerText = state.members.length;
            document.getElementById('expenseCount').innerText = state.expenses.length;

            updateStats();
            renderExpenseList();
            renderMembers();
            renderSettlement();
        }

        // Switch Tabs
        function switchTab(tabName) {
            const tabs = ['Expenses', 'Settlement', 'Members'];
            tabs.forEach((tab, index) => {
                const targetEl = document.getElementById(`tab${tab}`);
                const btnEl = document.getElementById(`tabBtn${index + 1}`);
                
                if (tab.toLowerCase() === tabName.toLowerCase()) {
                    targetEl.classList.remove('hidden');
                    btnEl.className = "flex-1 py-2 rounded-lg text-center font-bold bg-white text-indigo-600 shadow-sm transition-all";
                } else {
                    targetEl.classList.add('hidden');
                    btnEl.className = "flex-1 py-2 rounded-lg text-center font-semibold text-slate-600 transition-all";
                }
            });
        }

        // Stats Update
        function updateStats() {
            const total = state.expenses.reduce((sum, exp) => sum + Number(exp.amount), 0);
            const perPerson = state.members.length > 0 ? Math.round(total / state.members.length) : 0;

            document.getElementById('statTotalAmount').innerText = total.toLocaleString() + '원';
            document.getElementById('statPerPersonAmount').innerText = perPerson.toLocaleString() + '원';
        }

        // Expenses List Rendering
        function renderExpenseList() {
            const listEl = document.getElementById('expenseList');
            const emptyEl = document.getElementById('emptyExpenseState');
            listEl.innerHTML = '';

            let filtered = state.expenses;
            if (state.selectedCategory !== 'ALL') {
                filtered = state.expenses.filter(e => e.category === state.selectedCategory);
            }

            if (filtered.length === 0) {
                emptyEl.classList.remove('hidden');
                return;
            } else {
                emptyEl.classList.add('hidden');
            }

            // Sort newest first
            const sorted = [...filtered].reverse();

            sorted.forEach(exp => {
                const categoryIcons = {
                    '식비': '🍔',
                    '교통': '🚗',
                    '숙박': '🏨',
                    '관광/쇼핑': '🎟️',
                    '기타': '🎈'
                };

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between";
                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center text-lg font-bold">
                            ${categoryIcons[exp.category] || '💸'}
                        </div>
                        <div>
                            <div class="flex items-center gap-1.5">
                                <h4 class="font-bold text-slate-800 text-sm">${escapeHtml(exp.title)}</h4>
                                <span class="text-[10px] bg-slate-100 text-slate-500 px-1.5 py-0.5 rounded">${exp.category}</span>
                            </div>
                            <p class="text-xs text-slate-400 mt-0.5">
                                <span class="font-semibold text-slate-600">${escapeHtml(exp.payer)}</span> 결제 
                                <span class="text-slate-300">|</span> 
                                N빵 (${exp.participants.length}명): ${exp.participants.map(p => escapeHtml(p)).join(', ')}
                            </p>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="font-black text-slate-800 text-base">${Number(exp.amount).toLocaleString()}원</div>
                        <div class="flex gap-2 justify-end mt-1">
                            <button onclick="openExpenseModal('${exp.id}')" class="text-slate-400 hover:text-indigo-600 text-xs">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteExpense('${exp.id}')" class="text-slate-400 hover:text-rose-500 text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // Category Filter Function
        function filterCategory(cat) {
            state.selectedCategory = cat;
            document.querySelectorAll('.cat-filter-btn').forEach(btn => {
                if ((cat === 'ALL' && btn.innerText === '전체') || btn.innerText.includes(cat)) {
                    btn.className = "cat-filter-btn active bg-slate-800 text-white text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap";
                } else {
                    btn.className = "cat-filter-btn bg-white text-slate-600 border border-slate-200 text-xs px-3 py-1.5 rounded-full font-medium whitespace-nowrap";
                }
            });
            renderExpenseList();
        }

        // Modal Handlers
        function openExpenseModal(expenseId = null) {
            if (state.members.length === 0) {
                showToast("먼저 여행 멤버를 등록해주세요!");
                switchTab('members');
                return;
            }

            const modal = document.getElementById('expenseModal');
            const payerSelect = document.getElementById('modalPayerSelect');
            const participantsContainer = document.getElementById('modalParticipantsContainer');
            
            // Populate Payer Select
            payerSelect.innerHTML = state.members.map(m => `<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('');

            if (expenseId) {
                // Edit mode
                const exp = state.expenses.find(e => e.id === expenseId);
                document.getElementById('modalTitle').innerText = "지출 수정하기";
                document.getElementById('modalExpenseId').value = exp.id;
                document.getElementById('modalTitleInput').value = exp.title;
                document.getElementById('modalAmountInput').value = exp.amount;
                document.getElementById('modalCategorySelect').value = exp.category;
                payerSelect.value = exp.payer;

                renderParticipantCheckboxes(exp.participants);
            } else {
                // Add mode
                document.getElementById('modalTitle').innerText = "지출 등록하기";
                document.getElementById('modalExpenseId').value = "";
                document.getElementById('modalTitleInput').value = "";
                document.getElementById('modalAmountInput').value = "";
                document.getElementById('modalCategorySelect').value = "식비";
                
                renderParticipantCheckboxes(state.members); // All selected by default
            }

            modal.classList.remove('hidden');
        }

        function renderParticipantCheckboxes(selectedList) {
            const container = document.getElementById('modalParticipantsContainer');
            container.innerHTML = state.members.map(m => {
                const isChecked = selectedList.includes(m);
                return `
                    <label class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-3 py-1.5 rounded-xl cursor-pointer text-xs font-medium has-[:checked]:bg-indigo-50 has-[:checked]:border-indigo-300 has-[:checked]:text-indigo-700">
                        <input type="checkbox" name="modalParticipant" value="${escapeHtml(m)}" ${isChecked ? 'checked' : ''} class="accent-indigo-600 rounded">
                        <span>${escapeHtml(m)}</span>
                    </label>
                `;
            }).join('');
        }

        function selectAllParticipants(check) {
            document.querySelectorAll('input[name="modalParticipant"]').forEach(cb => cb.checked = check);
        }

        function closeExpenseModal() {
            document.getElementById('expenseModal').classList.add('hidden');
        }

        function saveExpense() {
            const id = document.getElementById('modalExpenseId').value;
            const title = document.getElementById('modalTitleInput').value.trim();
            const amount = parseFloat(document.getElementById('modalAmountInput').value);
            const category = document.getElementById('modalCategorySelect').value;
            const payer = document.getElementById('modalPayerSelect').value;
            
            const participants = Array.from(document.querySelectorAll('input[name="modalParticipant"]:checked'))
                                      .map(cb => cb.value);

            if (!title) {
                showToast("사용 내역을 입력해주세요.");
                return;
            }
            if (isNaN(amount) || amount <= 0) {
                showToast("올바른 금액을 입력해주세요.");
                return;
            }
            if (participants.length === 0) {
                showToast("함께 부담할 사람을 1명 이상 선택해주세요.");
                return;
            }

            if (id) {
                // Update
                const index = state.expenses.findIndex(e => e.id === id);
                if (index !== -1) {
                    state.expenses[index] = { id, title, amount, category, payer, participants };
                }
            } else {
                // New
                const newExpense = {
                    id: Date.now().toString(),
                    title,
                    amount,
                    category,
                    payer,
                    participants
                };
                state.expenses.push(newExpense);
            }

            closeExpenseModal();
            saveState();
            renderAll();
            showToast("지출이 저장되었습니다.");
        }

        function deleteExpense(id) {
            state.expenses = state.expenses.filter(e => e.id !== id);
            saveState();
            renderAll();
            showToast("지출 내역이 삭제되었습니다.");
        }

        // Member Management
        function renderMembers() {
            const listEl = document.getElementById('memberChipList');
            listEl.innerHTML = '';

            state.members.forEach(member => {
                const item = document.createElement('div');
                item.className = "flex justify-between items-center bg-slate-50 border border-slate-200 px-3.5 py-2.5 rounded-xl text-sm";
                item.innerHTML = `
                    <span class="font-semibold text-slate-700"><i class="fa-solid fa-user text-slate-400 mr-2"></i>${escapeHtml(member)}</span>
                    <button onclick="removeMember('${escapeHtml(member)}')" class="text-slate-400 hover:text-rose-500 text-xs p-1">
                        <i class="fa-solid fa-xmark"></i> 삭제
                    </button>
                `;
                listEl.appendChild(item);
            });
        }

        function addMember() {
            const input = document.getElementById('newMemberInput');
            const name = input.value.trim();

            if (!name) {
                showToast("이름을 입력해주세요.");
                return;
            }
            if (state.members.includes(name)) {
                showToast("이미 존재하여 중복 등록할 수 없습니다.");
                return;
            }

            state.members.push(name);
            input.value = '';
            saveState();
            renderAll();
            showToast(`${name} 님이 추가되었습니다.`);
        }

        function removeMember(name) {
            // Check if member is used in expenses
            const used = state.expenses.some(e => e.payer === name || e.participants.includes(name));
            if (used) {
                if (!confirm(`${name} 님의 기존 지출 기록이 있습니다. 멤버에서 제외할까요?`)) {
                    return;
                }
            }

            state.members = state.members.filter(m => m !== name);
            saveState();
            renderAll();
            showToast(`${name} 님이 삭제되었습니다.`);
        }

        // Settlement Algorithm & Render
        function calculateSettlement() {
            // Calculate balances
            const balances = {};
            const paidTotals = {};
            const owedTotals = {};

            state.members.forEach(m => {
                balances[m] = 0;
                paidTotals[m] = 0;
                owedTotals[m] = 0;
            });

            state.expenses.forEach(exp => {
                const amount = Number(exp.amount);
                const payer = exp.payer;
                const share = amount / exp.participants.length;

                if (paidTotals[payer] !== undefined) paidTotals[payer] += amount;

                exp.participants.forEach(p => {
                    if (owedTotals[p] !== undefined) owedTotals[p] += share;
                });
            });

            state.members.forEach(m => {
                balances[m] = (paidTotals[m] || 0) - (owedTotals[m] || 0);
            });

            // Calculate Minimum Transfers
            const debtors = [];  // Persons who owe money (balance < 0)
            const creditors = []; // Persons who should receive money (balance > 0)

            Object.keys(balances).forEach(m => {
                const bal = balances[m];
                if (bal < -1) {
                    debtors.push({ member: m, amount: -bal });
                } else if (bal > 1) {
                    creditors.push({ member: m, amount: bal });
                }
            });

            // Greedily match debtors with creditors
            const transactions = [];
            let i = 0, j = 0;

            while (i < debtors.length && j < creditors.length) {
                const debtor = debtors[i];
                const creditor = creditors[j];

                const amount = Math.min(debtor.amount, creditor.amount);
                transactions.push({
                    from: debtor.member,
                    to: creditor.member,
                    amount: Math.round(amount)
                });

                debtor.amount -= amount;
                creditor.amount -= amount;

                if (debtor.amount < 1) i++;
                if (creditor.amount < 1) j++;
            }

            return { balances, paidTotals, owedTotals, transactions };
        }

        function renderSettlement() {
            const { balances, paidTotals, owedTotals, transactions } = calculateSettlement();

            // Render Transactions
            const transListEl = document.getElementById('settlementTransList');
            transListEl.innerHTML = '';

            if (transactions.length === 0) {
                transListEl.innerHTML = `
                    <div class="text-center py-6 text-slate-400 text-xs">
                        🎉 서로 정산할 내역이 없거나 완전히 일치합니다!
                    </div>
                `;
            } else {
                transactions.forEach(t => {
                    const item = document.createElement('div');
                    item.className = "flex items-center justify-between p-3 bg-indigo-50/50 rounded-xl border border-indigo-100";
                    item.innerHTML = `
                        <div class="flex items-center gap-2 text-sm font-bold text-slate-800">
                            <span class="text-indigo-600">${escapeHtml(t.from)}</span>
                            <i class="fa-solid fa-arrow-right text-xs text-slate-400"></i>
                            <span class="text-emerald-600">${escapeHtml(t.to)}</span>
                        </div>
                        <div class="font-black text-indigo-700 text-sm">
                            ${t.amount.toLocaleString()}원
                        </div>
                    `;
                    transListEl.appendChild(item);
                });
            }

            // Render Member Balances
            const balanceListEl = document.getElementById('memberBalanceList');
            balanceListEl.innerHTML = '';

            state.members.forEach(m => {
                const paid = Math.round(paidTotals[m] || 0);
                const owed = Math.round(owedTotals[m] || 0);
                const net = Math.round(balances[m] || 0);

                let netBadgeClass = "bg-slate-100 text-slate-600";
                let netText = "0원";

                if (net > 0) {
                    netBadgeClass = "bg-emerald-50 text-emerald-600 font-bold";
                    netText = `+${net.toLocaleString()}원 받기`;
                } else if (net < 0) {
                    netBadgeClass = "bg-rose-50 text-rose-600 font-bold";
                    netText = `${net.toLocaleString()}원 보낼 돈`;
                }

                const card = document.createElement('div');
                card.className = "border border-slate-100 p-3 rounded-xl bg-slate-50/50 flex items-center justify-between";
                card.innerHTML = `
                    <div>
                        <div class="font-bold text-slate-800 text-sm">${escapeHtml(m)}</div>
                        <div class="text-[11px] text-slate-400 mt-0.5">
                            총 결제 ${paid.toLocaleString()}원 · 본인 부담 ${owed.toLocaleString()}원
                        </div>
                    </div>
                    <div class="text-xs px-2.5 py-1 rounded-lg ${netBadgeClass}">
                        ${netText}
                    </div>
                `;
                balanceListEl.appendChild(card);
            });
        }

        // Copy Settlement Summary to Clipboard
        function copySettlementSummary() {
            const { transactions, paidTotals } = calculateSettlement();
            const totalSpent = state.expenses.reduce((s, e) => s + Number(e.amount), 0);

            let summary = `✈️ [${state.tripTitle}] 정산 내역\n`;
            summary += `-------------------------\n`;
            summary += `💵 총 지출: ${totalSpent.toLocaleString()}원\n`;
            summary += `👥 참여 멤버: ${state.members.join(', ')}\n\n`;

            summary += `💡 [최소 송금 안내]\n`;
            if (transactions.length === 0) {
                summary += `정산할 금액이 없습니다!\n`;
            } else {
                transactions.forEach(t => {
                    summary += `• ${t.from} ➡️ ${t.to} : ${t.amount.toLocaleString()}원\n`;
                });
            }

            summary += `\n지출 내역 확인 후 위 금액대로 송금해주세요! 👍`;

            // Copy logic using fallback
            const textArea = document.createElement("textarea");
            textArea.value = summary;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("카카오톡 공유용 내역이 복사되었습니다!");
            } catch (err) {
                showToast("복사에 실패했습니다.");
            }
            document.body.removeChild(textArea);
        }

        // Edit Trip Title
        function editTripTitle() {
            const newTitle = prompt("여행 이름을 입력하세요:", state.tripTitle);
            if (newTitle && newTitle.trim() !== "") {
                state.tripTitle = newTitle.trim();
                saveState();
                renderAll();
            }
        }

        // Helper Toast Notice
        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            toast.classList.remove('opacity-0');
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2000);
        }

        // Security Utility
        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
            });
        }
    </script>
